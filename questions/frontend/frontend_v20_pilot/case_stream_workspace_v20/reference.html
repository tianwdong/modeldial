<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Case Stream</title>
  <style>
    :root{color-scheme:dark;--bg:#080d0f;--panel:#0e171a;--panel2:#132126;--line:#26383e;--text:#f0f7f8;--muted:#91a5aa;--cyan:#5bd5d7;--mint:#77d9a6;--amber:#f2b860;--red:#ff7d75;--row:56px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button,select{color:inherit}.app{width:min(1380px,calc(100% - 32px));margin:auto;padding:18px 0 28px}.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:15px}.eyebrow{margin:0 0 5px;color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.topbar h1{margin:0;font-size:clamp(27px,3vw,40px);line-height:1;letter-spacing:-.04em}.subtitle{margin:8px 0 0;color:var(--muted)}.live{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#0b1416}.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 5px #77d9a61a}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:11px}.metric{min-height:74px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:#0c1518}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:3px;font:750 25px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.query-panel{padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--panel);margin-bottom:11px}.query-row{display:grid;grid-template-columns:minmax(220px,1fr) 190px;gap:10px}.field{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:700}.field input,.field select{height:46px;border:1px solid #345058;border-radius:10px;background:#091114;color:var(--text);padding:0 12px}.facet-groups{display:grid;gap:9px;margin-top:11px}.facet-line{display:flex;align-items:center;gap:8px;min-width:0}.facet-label{width:52px;flex:0 0 auto;color:var(--muted);font-size:12px}.facet-strip{display:flex;gap:6px;min-width:0;overflow:auto}.facet{min-height:44px;white-space:nowrap;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#122025;cursor:pointer}.facet[aria-pressed="true"]{border-color:#49aeb0;background:#16383b;color:#caffff}.bulkbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;padding:6px 8px 6px 14px;border:1px solid var(--line);border-radius:13px;background:#0b1416;margin-bottom:11px}.bulk-actions{display:flex;gap:7px}.bulk-actions button,.primary,.ghost{min-height:44px;border:1px solid var(--line);border-radius:9px;background:#142328;padding:0 13px;cursor:pointer}.bulk-actions button:disabled{opacity:.4;cursor:not-allowed}.primary{border-color:#4ca9a8;background:#184042}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:11px}.results-panel,.inspector{border:1px solid var(--line);border-radius:15px;background:var(--panel);overflow:hidden;box-shadow:0 18px 55px #0004}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:15px}.hint{color:var(--muted);font-size:11px}.virtual-list{position:relative;height:336px;overflow:auto;outline:none;overscroll-behavior:contain;background:#0a1214}.virtual-spacer{position:relative;width:100%}.case-row{position:absolute;left:0;right:0;height:56px;display:grid;grid-template-columns:48px minmax(0,1fr) 118px 112px;align-items:center;border-bottom:1px solid #1d3035;background:#0d171a}.case-row[data-active="true"]{z-index:2;background:#13282c;box-shadow:inset 3px 0 0 var(--cyan)}.case-row[data-selected="true"]{background:#142a24}.case-row[data-saving="true"]{background:#302719;box-shadow:inset 3px 0 0 var(--amber)}.case-row:focus-visible{outline:3px solid #a7efff;outline-offset:-4px}.select-toggle{width:44px;height:44px;margin:auto;border:0;background:transparent;cursor:pointer}.select-toggle::before{content:"";display:block;width:17px;height:17px;margin:auto;border:1px solid #547078;border-radius:4px;background:#091114}.case-row[data-selected="true"] .select-toggle::before{border-color:var(--mint);background:var(--mint);box-shadow:inset 0 0 0 4px #173227}.case-main{min-width:0;cursor:pointer}.case-main strong,.case-main span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.case-main strong{font-size:13px}.case-main span{color:var(--muted);font-size:11px}.pill{justify-self:start;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:#b9cbcf;font-size:11px}.priority{font-weight:800}.priority-P0{color:#ffaaa4;border-color:#6c3937;background:#321c1c}.priority-P1{color:#ffd08b;border-color:#614a2a;background:#2d2518}.priority-P2{color:#8ee5e7}.row-team{padding-right:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty-state{height:336px;display:grid;place-items:center;color:var(--muted)}.inspector{min-height:391px;background:var(--panel2)}.inspector-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--line)}.inspector-head h2{margin:0;font-size:15px}.close-icon{width:44px;height:44px;border:0;border-radius:9px;background:#1b3035;cursor:pointer}.inspector-body{padding:16px}.inspector-empty{display:grid;min-height:300px;place-items:center;text-align:center;color:var(--muted)}.case-id{margin:0;color:var(--cyan);font:750 11px ui-monospace,SFMono-Regular,Menlo,monospace}.inspector-body h3{margin:7px 0 4px;font-size:23px}.meta{margin:0 0 15px;color:var(--muted)}.summary{padding:12px;border:1px solid var(--line);border-radius:10px;background:#0b1719;color:#c6d4d7}.details{display:grid;gap:1px;margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.detail{display:flex;justify-content:space-between;gap:12px;padding:9px 10px;background:#0c181b}.detail span:first-child{color:var(--muted)}.inspector-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.save-alert{margin:0 0 10px;border:1px solid #9e4b47;border-radius:9px;background:#3a1d1d;color:#ffd5d1;padding:10px}.save-status{display:flex;align-items:center;min-height:44px;margin-top:11px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#0b1416;color:var(--muted)}
    @media(max-width:880px){.app{width:min(100% - 24px,860px)}.workspace{grid-template-columns:minmax(0,1fr) 280px}.case-row{grid-template-columns:48px minmax(0,1fr) 96px}.row-team{display:none}.query-row{grid-template-columns:minmax(0,1fr) 170px}}
    @media(max-width:560px){.app{width:100%;padding:12px}.topbar{align-items:flex-start}.subtitle,.live{display:none}.metrics{gap:6px}.metric{min-height:63px;padding:10px}.metric strong{font-size:20px}.query-row{grid-template-columns:1fr}.facet-line{display:block}.facet-label{display:block;width:auto;margin:0 0 5px}.bulkbar{align-items:flex-start;flex-direction:column}.bulk-actions{width:100%}.bulk-actions button{flex:1;padding:0 8px}.workspace{display:block}.case-row{grid-template-columns:46px minmax(0,1fr) 78px}.row-team{display:none}.pill{padding:3px 6px}.inspector{display:none;position:fixed;inset:0;z-index:40;min-height:100vh;border:0;border-radius:0;overflow:auto}.inspector[data-mobile-open="true"]{display:block}.inspector-empty{min-height:70vh}.save-status{margin-bottom:8px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <main class="app" data-md-role="app">
    <header class="topbar"><div><p class="eyebrow">Evidence operations</p><h1 data-md-role="page-heading">Case Stream</h1><p class="subtitle">A synchronized, keyboard-first queue for high-volume review.</p></div><div class="live">Live dataset</div></header>
    <section class="metrics" aria-label="Case summary" data-md-role="summary"><div class="metric" data-md-role="metric" data-md-id="total"><span data-md-role="metric-label" data-md-id="total">Total cases</span><strong id="metric-total" data-md-role="metric-value" data-md-id="total">0</strong></div><div class="metric" data-md-role="metric" data-md-id="matching"><span data-md-role="metric-label" data-md-id="matching">Matching cases</span><strong id="metric-matching" data-md-role="metric-value" data-md-id="matching">0</strong></div><div class="metric" data-md-role="metric" data-md-id="selected"><span data-md-role="metric-label" data-md-id="selected">Selected cases</span><strong id="metric-selected" data-md-role="metric-value" data-md-id="selected">0</strong></div></section>
    <section class="query-panel" aria-label="Case query controls" data-md-role="query"><div class="query-row"><label class="field">Search cases<input id="search" type="search" autocomplete="off" data-md-role="search"></label><label class="field">Sort cases<select id="sort" data-md-role="sort"><option value="priority">Priority</option><option value="recent">Recently updated</option><option value="owner">Owner</option><option value="id">ID</option></select></label></div><div class="facet-groups"><div class="facet-line"><span class="facet-label">Team</span><div id="team-facets" class="facet-strip" data-md-role="facet-group" data-md-id="team"></div></div><div class="facet-line"><span class="facet-label">Status</span><div id="status-facets" class="facet-strip" data-md-role="facet-group" data-md-id="status"></div></div></div></section>
    <section class="bulkbar" aria-label="Selection actions" data-md-role="bulk-actions"><strong id="selection-copy" data-md-role="selection-count">0 cases selected</strong><div class="bulk-actions"><button id="mark-investigating" type="button" data-md-action="bulk-investigating">Mark investigating</button><button id="mark-resolved" type="button" data-md-action="bulk-resolved">Mark resolved</button></div></section>
    <section class="workspace"><section class="results-panel" data-md-role="results-panel" aria-label="Case results panel"><div class="panel-head"><h2 data-md-role="section-heading">Case results</h2><span class="hint">56px rows · keyboard ready</span></div><div id="virtual-list" class="virtual-list" role="listbox" aria-label="Case results" data-md-role="results"><div id="virtual-spacer" class="virtual-spacer"><div id="virtual-layer"></div></div></div></section><aside id="inspector" class="inspector" aria-label="Case inspector" data-mobile-open="false" data-md-role="inspector" data-md-id=""><div class="inspector-head"><h2 data-md-role="inspector-heading">Case inspector</h2><button class="close-icon" type="button" data-action="close" data-md-action="close-inspector" aria-label="Close case inspector">×</button></div><div id="inspector-body" class="inspector-body" data-md-role="inspector-body"></div></aside></section>
    <div id="save-status" class="save-status" role="status" aria-live="polite" data-md-role="live-status">All updates confirmed.</div>
  </main>
  <script>
  (()=>{
    const makeFallback=()=>Array.from({length:40},(_,index)=>{const number=index+1;return{id:`CASE-${String(number).padStart(3,"0")}`,title:`Review case ${number}`,owner:["Ari Cole","Bo Lin","Cia Moss","Dev Rao"][index%4],team:["Core","Edge","Data","Trust"][index%4],status:["open","investigating","resolved"][index%3],priority:["P0","P1","P2","P3"][index%4],updatedAt:1700000000000-index*60000,tags:[`tag-${index%5}`,`lane-${index%3}`],summary:`Evidence summary for case ${number}.`}});
    const injected=window.MODELDIAL_CASES||makeFallback(),cases=new Map(injected.map(item=>[String(item.id),JSON.parse(JSON.stringify(item))]));
    const confirmed=new Map([...cases].map(([id,item])=>[id,item.status])),latest=new Map([...cases].map(([id])=>[id,0])),pending=new Map([...cases].map(([id])=>[id,new Set()]));
    const priorityRank={P0:0,P1:1,P2:2,P3:3},ROW=56,OVERSCAN=2,PAGE=5;
    const search=document.getElementById("search"),sortSelect=document.getElementById("sort"),teamHost=document.getElementById("team-facets"),statusHost=document.getElementById("status-facets"),list=document.getElementById("virtual-list"),spacer=document.getElementById("virtual-spacer"),layer=document.getElementById("virtual-layer"),inspector=document.getElementById("inspector"),inspectorBody=document.getElementById("inspector-body"),statusLive=document.getElementById("save-status");
    let query="",team="All",caseStatus="All",sortMode="priority",activeId="",inspectedId="",openerId="",inspectorOpen=false,lastToggledId="",saveAlert="",queryTimer=0;
    const selected=new Set(),fold=value=>String(value??"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLocaleLowerCase().trim().replace(/\s+/g," "),textOrder=(a,b)=>String(a).localeCompare(String(b)),button=(label,value,pressed,group)=>{const item=document.createElement("button");item.type="button";item.className="facet";item.textContent=label;item.dataset.value=value;item.dataset.mdRole="facet";item.dataset.mdAction="set-facet";item.dataset.mdId=`${group}:${value}`;item.setAttribute("aria-pressed",String(pressed));return item};
    function readUrl(){const params=new URL(location.href).searchParams;query=fold(params.get("q")||"");const teams=new Set([...cases.values()].map(item=>item.team)),statuses=new Set([...cases.values()].map(item=>item.status));team=teams.has(params.get("team"))?params.get("team"):"All";caseStatus=statuses.has(params.get("status"))?params.get("status"):"All";sortMode=["priority","recent","owner","id"].includes(params.get("sort"))?params.get("sort"):"priority"}
    function urlForState(){const url=new URL(location.href),unrelated=[...url.searchParams].filter(([key])=>!["q","team","status","sort"].includes(key));url.search="";for(const [key,value] of unrelated)url.searchParams.append(key,value);if(query)url.searchParams.append("q",query);if(team!=="All")url.searchParams.append("team",team);if(caseStatus!=="All")url.searchParams.append("status",caseStatus);if(sortMode!=="priority")url.searchParams.append("sort",sortMode);return url.pathname+(url.search||"")+url.hash}
    function snapshot(){return{activeId,scrollTop:list.scrollTop}}
    function writeUrl(mode){history[mode](snapshot(),"",urlForState())}
    function compare(a,b){if(sortMode==="priority")return(priorityRank[a.priority]??9)-(priorityRank[b.priority]??9)||textOrder(a.id,b.id);if(sortMode==="recent")return Number(b.updatedAt)-Number(a.updatedAt)||textOrder(a.id,b.id);if(sortMode==="owner")return textOrder(a.owner,b.owner)||textOrder(a.id,b.id);return textOrder(a.id,b.id)}
    function results(){const tokens=fold(query).split(" ").filter(Boolean);return[...cases.values()].filter(item=>(team==="All"||item.team===team)&&(caseStatus==="All"||item.status===caseStatus)&&tokens.every(token=>fold([item.id,item.title,item.owner,...(item.tags||[])].join(" ")).includes(token))).sort(compare)}
    function renderFacets(){teamHost.replaceChildren(button("All","All",team==="All","team"),...[...new Set([...cases.values()].map(item=>item.team))].sort(textOrder).map(value=>button(value,value,team===value,"team")));statusHost.replaceChildren(button("All","All",caseStatus==="All","status"),...[...new Set([...cases.values()].map(item=>item.status))].sort(textOrder).map(value=>button(value,value,caseStatus===value,"status")));search.value=query;sortSelect.value=sortMode}
    function caseRow(item,index,total){const row=document.createElement("div");row.className="case-row";row.role="option";row.tabIndex=item.id===activeId?0:-1;row.dataset.caseId=item.id;row.dataset.mdRole="row";row.dataset.mdId=item.id;row.dataset.active=String(item.id===activeId);row.dataset.selected=String(selected.has(item.id));row.dataset.saving=String(Boolean(pending.get(item.id)?.size));row.dataset.status=item.status;row.dataset.index=String(index);row.style.transform=`translateY(${index*ROW}px)`;row.setAttribute("aria-current",String(item.id===activeId));row.setAttribute("aria-selected",String(selected.has(item.id)));row.setAttribute("aria-busy",String(Boolean(pending.get(item.id)?.size)));row.setAttribute("aria-posinset",String(index+1));row.setAttribute("aria-setsize",String(total));row.setAttribute("aria-label",`${item.id}, ${item.title}, ${item.owner}, ${item.team}, ${item.status}, ${item.priority}`);const toggle=document.createElement("button");toggle.type="button";toggle.className="select-toggle";toggle.dataset.selectId=item.id;toggle.dataset.mdAction="select";toggle.dataset.mdId=item.id;toggle.setAttribute("aria-label",`Toggle selection ${item.id}`);toggle.setAttribute("aria-pressed",String(selected.has(item.id)));const main=document.createElement("div");main.className="case-main";main.dataset.openId=item.id;main.dataset.mdAction="open";main.dataset.mdId=item.id;const title=Object.assign(document.createElement("strong"),{textContent:`${item.id} · ${item.title}`});title.dataset.mdRole="row-title";title.dataset.mdId=item.id;const metadata=Object.assign(document.createElement("span"),{textContent:`${item.owner} · ${(item.tags||[]).join(" · ")}`});metadata.dataset.mdRole="row-meta";metadata.dataset.mdId=item.id;main.append(title,metadata);const priority=document.createElement("span");priority.className=`pill priority priority-${item.priority}`;priority.dataset.mdRole="row-priority";priority.dataset.mdId=item.id;priority.textContent=item.priority;const meta=document.createElement("span");meta.className="row-team";meta.dataset.mdRole="row-status";meta.dataset.mdId=item.id;meta.textContent=`${item.team} · ${item.status}`;row.append(toggle,main,priority,meta);return row}
    function normalizeActive(items){if(!items.length){activeId="";return}if(!items.some(item=>item.id===activeId))activeId=items[0].id}
    function renderList(focusId=""){const items=results();normalizeActive(items);spacer.style.height=`${items.length*ROW}px`;layer.replaceChildren();if(!items.length){const empty=document.createElement("div");empty.className="empty-state";empty.dataset.mdRole="results-empty";empty.textContent="No cases match this view.";layer.append(empty)}else{const start=Math.max(0,Math.floor(list.scrollTop/ROW)-OVERSCAN),end=Math.min(items.length,Math.ceil((list.scrollTop+list.clientHeight)/ROW)+OVERSCAN);for(let index=start;index<end;index++)layer.append(caseRow(items[index],index,items.length))}document.getElementById("metric-matching").textContent=String(items.length);if(focusId)requestAnimationFrame(()=>layer.querySelector(`[data-md-role="row"][data-md-id="${CSS.escape(focusId)}"]`)?.focus())}
    function detail(label,value){const row=document.createElement("div");row.className="detail";row.append(Object.assign(document.createElement("span"),{textContent:label}),Object.assign(document.createElement("span"),{textContent:value}));return row}
    function renderInspector(){inspector.dataset.mobileOpen=String(inspectorOpen);inspector.dataset.mdId=inspectorOpen?inspectedId:"";inspectorBody.replaceChildren();if(saveAlert){const alert=document.createElement("div");alert.className="save-alert";alert.role="alert";alert.dataset.mdRole="alert";alert.textContent=saveAlert;inspectorBody.append(alert)}const item=inspectedId&&cases.get(inspectedId);if(!item){const empty=document.createElement("div");empty.className="inspector-empty";empty.textContent="Select a case to inspect its evidence and state.";inspectorBody.append(empty);return}const id=document.createElement("p");id.className="case-id";id.textContent=`${item.id} · ${item.priority}`;const title=document.createElement("h3");title.textContent=item.title;const meta=document.createElement("p");meta.className="meta";meta.textContent=`${item.owner} · ${item.team}`;const summary=document.createElement("div");summary.className="summary";summary.textContent=item.summary||"No summary provided.";const details=document.createElement("div");details.className="details";details.append(detail("Status",item.status),detail("Updated",String(item.updatedAt)),detail("Tags",(item.tags||[]).join(", ")||"None"));const actions=document.createElement("div");actions.className="inspector-actions";const select=document.createElement("button");select.type="button";select.className="primary";select.dataset.selectInspector=item.id;select.dataset.mdAction="select";select.dataset.mdId=item.id;select.setAttribute("aria-pressed",String(selected.has(item.id)));select.textContent=selected.has(item.id)?"Remove selection":"Add selection";const close=document.createElement("button");close.type="button";close.className="ghost";close.dataset.action="close";close.dataset.mdAction="close-inspector";close.textContent="Close case inspector";actions.append(select,close);inspectorBody.append(id,title,meta,summary,details,actions)}
    function renderChrome(){document.getElementById("metric-total").textContent=String(cases.size);document.getElementById("metric-selected").textContent=String(selected.size);document.getElementById("selection-copy").textContent=`${selected.size} ${selected.size===1?"case":"cases"} selected`;document.querySelectorAll(".bulk-actions button").forEach(control=>control.disabled=selected.size===0);statusLive.textContent=[...pending.values()].some(set=>set.size)?"Saving case updates…":"All updates confirmed."}
    function render(focusId=""){renderFacets();renderChrome();renderList(focusId);renderInspector();document.documentElement.dataset.appReady="true"}
    function ensureIndex(index,focus=true){const items=results();if(!items.length)return;const next=Math.max(0,Math.min(items.length-1,index)),top=next*ROW,bottom=top+ROW;if(top<list.scrollTop)list.scrollTop=top;else if(bottom>list.scrollTop+list.clientHeight)list.scrollTop=bottom-list.clientHeight;activeId=items[next].id;renderList(focus?activeId:"")}
    function toggleSelection(id,range=false){const items=results(),ids=items.map(item=>item.id);if(range&&lastToggledId&&ids.includes(lastToggledId)){const left=ids.indexOf(lastToggledId),right=ids.indexOf(id);for(const value of ids.slice(Math.min(left,right),Math.max(left,right)+1))selected.add(value)}else{selected.has(id)?selected.delete(id):selected.add(id);lastToggledId=id}render()}
    function openInspector(id){activeId=inspectedId=openerId=id;inspectorOpen=true;saveAlert="";render()}
    function closeInspector(){inspectorOpen=false;renderInspector();const index=results().findIndex(item=>item.id===openerId);if(index>=0)ensureIndex(index,true)}
    async function saveOne(id,nextStatus){const revision=(latest.get(id)||0)+1;latest.set(id,revision);pending.get(id).add(revision);cases.set(id,{...cases.get(id),status:nextStatus});render();let request;try{request=window.MODELDIAL_SAVE_CASE({id,status:nextStatus,revision})}catch(error){request=Promise.reject(error)}try{const response=await Promise.resolve(request);pending.get(id).delete(revision);if(latest.get(id)===revision){const accepted=String(response?.status||nextStatus);cases.set(id,{...cases.get(id),status:accepted});confirmed.set(id,accepted)}render();return{id,ok:true}}catch(error){pending.get(id).delete(revision);if(latest.get(id)===revision)cases.set(id,{...cases.get(id),status:confirmed.get(id)});render();return{id,ok:false}}}
    async function bulkUpdate(nextStatus){saveAlert="";const ids=[...selected].filter(id=>cases.has(id));if(!ids.length)return;const outcomes=await Promise.all(ids.map(id=>saveOne(id,nextStatus))),failed=outcomes.filter(item=>!item.ok).map(item=>item.id).sort(textOrder);if(failed.length)saveAlert=`${failed.length} update failed. Restored ${failed.join(", ")}.`;render()}
    function pushChange(change){history.replaceState(snapshot(),"",location.href);change();list.scrollTop=0;activeId="";render();history.pushState(snapshot(),"",urlForState())}
    teamHost.addEventListener("click",event=>{const item=event.target.closest("[data-value]");if(item&&item.dataset.value!==team)pushChange(()=>team=item.dataset.value)});statusHost.addEventListener("click",event=>{const item=event.target.closest("[data-value]");if(item&&item.dataset.value!==caseStatus)pushChange(()=>caseStatus=item.dataset.value)});sortSelect.addEventListener("change",()=>pushChange(()=>sortMode=sortSelect.value));
    search.addEventListener("input",()=>{query=fold(search.value);clearTimeout(queryTimer);queryTimer=setTimeout(()=>{list.scrollTop=0;activeId="";render();writeUrl("replaceState")},120)});
    list.addEventListener("scroll",()=>renderList());list.addEventListener("click",event=>{const toggle=event.target.closest("[data-select-id]");if(toggle){toggleSelection(toggle.dataset.selectId,event.shiftKey);return}const open=event.target.closest("[data-open-id]");if(open)openInspector(open.dataset.openId)});list.addEventListener("keydown",event=>{const row=event.target.closest("[data-case-id]");if(!row)return;const items=results(),index=items.findIndex(item=>item.id===row.dataset.caseId);let next=index;if(event.key==="ArrowDown")next++;else if(event.key==="ArrowUp")next--;else if(event.key==="Home")next=0;else if(event.key==="End")next=items.length-1;else if(event.key==="PageDown")next+=PAGE;else if(event.key==="PageUp")next-=PAGE;else if(event.key===" "){event.preventDefault();toggleSelection(row.dataset.caseId,event.shiftKey);return}else if(event.key==="Enter"){event.preventDefault();openInspector(row.dataset.caseId);return}else return;event.preventDefault();ensureIndex(next,true)});
    inspector.addEventListener("click",event=>{if(event.target.closest("[data-action='close']"))closeInspector();const item=event.target.closest("[data-select-inspector]");if(item)toggleSelection(item.dataset.selectInspector)});document.getElementById("mark-investigating").addEventListener("click",()=>bulkUpdate("investigating"));document.getElementById("mark-resolved").addEventListener("click",()=>bulkUpdate("resolved"));
    addEventListener("popstate",event=>{readUrl();render();requestAnimationFrame(()=>{list.scrollTop=Number(event.state?.scrollTop)||0;activeId=event.state?.activeId||"";renderList(activeId)})});addEventListener("resize",()=>render());
    readUrl();render();history.replaceState(snapshot(),"",urlForState());
  })();
  </script>
</body>
</html>
