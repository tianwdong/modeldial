<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Case Stream</title>
  <style>
    :root{color-scheme:dark;--bg:#080d0f;--panel:#0e171a;--panel2:#132126;--line:#26383e;--text:#f0f7f8;--muted:#91a5aa;--cyan:#5bd5d7;--mint:#77d9a6;--amber:#f2b860;--red:#ff7d75}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button,select{color:inherit}.app{width:min(1380px,calc(100% - 32px));margin:auto;padding:18px 0 28px}.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:15px}.eyebrow{margin:0 0 5px;color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.topbar h1{margin:0;font-size:clamp(27px,3vw,40px);line-height:1;letter-spacing:-.04em}.subtitle{margin:8px 0 0;color:var(--muted)}.live{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#0b1416}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:11px}.metric{min-height:74px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:#0c1518}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:3px;font:750 25px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.query-panel{padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--panel);margin-bottom:11px}.query-row{display:grid;grid-template-columns:minmax(220px,1fr) 190px;gap:10px}.field{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:700}.field input,.field select{height:46px;border:1px solid #345058;border-radius:10px;background:#091114;color:var(--text);padding:0 12px}.facet-groups{display:grid;gap:9px;margin-top:11px}.facet-line{display:flex;align-items:center;gap:8px}.facet-label{width:52px;color:var(--muted);font-size:12px}.facet-strip{display:flex;gap:6px;min-width:0;overflow:auto}.facet{min-height:44px;white-space:nowrap;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#122025}.facet[aria-pressed="true"]{border-color:#49aeb0;background:#16383b}.bulkbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;padding:6px 8px 6px 14px;border:1px solid var(--line);border-radius:13px;background:#0b1416;margin-bottom:11px}.bulk-actions{display:flex;gap:7px}.bulk-actions button,.ghost{min-height:44px;border:1px solid var(--line);border-radius:9px;background:#142328;padding:0 13px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:11px}.results-panel,.inspector{border:1px solid var(--line);border-radius:15px;background:var(--panel);overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:15px}.hint{color:var(--muted);font-size:11px}.virtual-list{height:336px;overflow:auto;background:#0a1214}.case-row{height:56px;display:grid;grid-template-columns:48px minmax(0,1fr) 118px 112px;align-items:center;border-bottom:1px solid #1d3035;background:#0d171a}.case-row[data-selected="true"]{background:#142a24}.case-row[data-saving="true"]{background:#302719}.select-toggle{width:44px;height:44px;margin:auto;border:0;background:transparent;color:var(--mint)}.case-main{min-width:0;cursor:pointer}.case-main strong,.case-main span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.case-main span,.row-team{color:var(--muted);font-size:11px}.pill{justify-self:start;border:1px solid var(--line);border-radius:999px;padding:4px 8px}.priority-P0{color:#ffaaa4}.priority-P1{color:#ffd08b}.priority-P2{color:#8ee5e7}.inspector{min-height:391px;background:var(--panel2)}.inspector-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--line)}.inspector-head h2{margin:0}.close-icon{width:44px;height:44px;border:0;border-radius:9px;background:#1b3035}.inspector-body{padding:16px}.inspector-empty{display:grid;min-height:300px;place-items:center;text-align:center;color:var(--muted)}.inspector-body h3{font-size:23px}.summary{padding:12px;border:1px solid var(--line);border-radius:10px;background:#0b1719}.save-status{display:flex;align-items:center;min-height:44px;margin-top:11px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#0b1416;color:var(--muted)}
    @media(max-width:880px){.app{width:min(100% - 24px,860px)}.workspace{grid-template-columns:minmax(0,1fr) 280px}.case-row{grid-template-columns:48px minmax(0,1fr) 90px}.row-team{display:none}}
    @media(max-width:560px){.app{width:100%;padding:12px}.subtitle,.live{display:none}.query-row{grid-template-columns:1fr}.bulkbar{align-items:flex-start;flex-direction:column}.workspace{display:block}.case-row{grid-template-columns:46px minmax(0,1fr) 78px}.inspector{display:none;position:fixed;inset:0;z-index:40;min-height:100vh;border:0;border-radius:0}.inspector[data-mobile-open="true"]{display:block}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div><p class="eyebrow">Evidence operations</p><h1>Case Stream</h1><p class="subtitle">A synchronized, keyboard-first queue for high-volume review.</p></div><div class="live">Live dataset</div></header>
    <section class="metrics" aria-label="Case summary"><div class="metric"><span>Total cases</span><strong id="metric-total">0</strong></div><div class="metric"><span>Matching cases</span><strong id="metric-matching">0</strong></div><div class="metric"><span>Selected cases</span><strong id="metric-selected">0</strong></div></section>
    <section class="query-panel" aria-label="Case query controls"><div class="query-row"><label class="field">Search cases<input id="search" type="search"></label><label class="field">Sort cases<select id="sort"><option value="priority">Priority</option><option value="recent">Recently updated</option><option value="owner">Owner</option><option value="id">ID</option></select></label></div><div class="facet-groups"><div class="facet-line"><span class="facet-label">Team</span><div id="team-facets" class="facet-strip"><button class="facet" aria-pressed="true">All</button><button class="facet" aria-pressed="false">Core</button></div></div><div class="facet-line"><span class="facet-label">Status</span><div id="status-facets" class="facet-strip"><button class="facet" aria-pressed="true">All</button><button class="facet" aria-pressed="false">open</button></div></div></div></section>
    <section class="bulkbar" aria-label="Selection actions"><strong id="selection-copy">0 cases selected</strong><div class="bulk-actions"><button id="mark-investigating" type="button">Mark investigating</button><button id="mark-resolved" type="button">Mark resolved</button></div></section>
    <section class="workspace"><section class="results-panel"><div class="panel-head"><h2>Case results</h2><span class="hint">Queue rows</span></div><div id="virtual-list" class="virtual-list" role="listbox" aria-label="Case results"><div id="virtual-spacer"><div id="virtual-layer"></div></div></div></section><aside id="inspector" class="inspector" aria-label="Case inspector" data-mobile-open="false"><div class="inspector-head"><h2>Case inspector</h2><button class="close-icon" type="button" aria-label="Close case inspector">×</button></div><div id="inspector-body" class="inspector-body"><div class="inspector-empty">Select a case to inspect its evidence and state.</div></div></aside></section>
    <div id="save-status" class="save-status" role="status" aria-live="polite">All updates confirmed.</div>
  </main>
  <script>
  (()=>{
    const source=window.MODELDIAL_CASES||[],cases=source.map(item=>JSON.parse(JSON.stringify(item))),selected=new Set();let inspected="",query="",saving=false;
    const search=document.getElementById("search"),sort=document.getElementById("sort"),layer=document.getElementById("virtual-layer"),inspector=document.getElementById("inspector"),body=document.getElementById("inspector-body"),status=document.getElementById("save-status");
    function filtered(){const value=query.toLowerCase();return cases.filter(item=>[item.id,item.title,item.owner,...item.tags].join(" ").toLowerCase().includes(value)).sort((a,b)=>a.id.localeCompare(b.id))}
    function renderInspector(){const item=cases.find(value=>value.id===inspected);inspector.dataset.mobileOpen=String(Boolean(item));if(!item){body.innerHTML='<div class="inspector-empty">Select a case to inspect its evidence and state.</div>';return}body.innerHTML=`<p>${item.id} · ${item.priority}</p><h3>${item.title}</h3><p>${item.owner} · ${item.team}</p><div class="summary">${item.summary}</div><button class="ghost" data-close type="button">Close case inspector</button>`}
    function render(){const items=filtered();document.getElementById("metric-total").textContent=String(cases.length);document.getElementById("metric-matching").textContent=String(items.length);document.getElementById("metric-selected").textContent=String(selected.size);document.getElementById("selection-copy").textContent=`${selected.size} cases selected`;layer.replaceChildren();for(const item of items){const row=document.createElement("div");row.className="case-row";row.dataset.caseId=item.id;row.dataset.selected=String(selected.has(item.id));row.dataset.saving=String(saving&&selected.has(item.id));row.dataset.status=item.status;row.innerHTML=`<button class="select-toggle" type="button" aria-label="Toggle selection ${item.id}">${selected.has(item.id)?"✓":""}</button><div class="case-main" data-open="${item.id}"><strong>${item.id} · ${item.title}</strong><span>${item.owner} · ${item.tags.join(" · ")}</span></div><span class="pill priority-${item.priority}">${item.priority}</span><span class="row-team">${item.team} · ${item.status}</span>`;row.querySelector("button").addEventListener("click",()=>{selected.has(item.id)?selected.delete(item.id):selected.add(item.id);render()});row.querySelector("[data-open]").addEventListener("click",()=>{inspected=item.id;renderInspector()});layer.append(row)}if(!items.length)layer.innerHTML='<div class="inspector-empty">No cases match this view.</div>';status.textContent=saving?"Saving case updates…":"All updates confirmed.";renderInspector();document.documentElement.dataset.appReady="true"}
    async function save(next){saving=true;for(const id of selected){const item=cases.find(value=>value.id===id);item.status=next;window.MODELDIAL_SAVE_CASE?.({id,status:next,revision:1}).catch(()=>{})}render();setTimeout(()=>{saving=false;render()},200)}
    search.addEventListener("input",()=>{query=search.value.trim();render()});sort.addEventListener("change",render);document.getElementById("mark-investigating").addEventListener("click",()=>save("investigating"));document.getElementById("mark-resolved").addEventListener("click",()=>save("resolved"));inspector.addEventListener("click",event=>{if(event.target.closest("[data-close],.close-icon")){inspected="";renderInspector()}});render();
  })();
  </script>
</body>
</html>
